name: "🚀 MAXIMIZED PRODUCTION DEPLOYMENT ENGINE"

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: "⚡ COMPILE & PUBLISH TO GITHUB PAGES"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js Environment (V8 Core)"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: "⚡ Cache Vite Build Intermediates"
        uses: actions/cache@v4
        with:
          path: .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-vite-

      # 🛠️ THE FIX: Appending the legacy peer modifier bypasses the ESLint version block on the cloud runner
      - name: "📦 Install Clean Project Dependencies"
        run: npm ci --legacy-peer-deps

      - name: "🏗️ Execute Optimization Build"
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: npm run build

      - name: "⚙️ Setup GitHub Pages Deployment Context"
        uses: actions/configure-pages@v5

      - name: "📤 Upload Optimized Production Artifacts"
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: "🚀 Deploy to GitHub Pages Live Link"
        id: deployment
        uses: actions/deploy-pages@v4
name: "🚀 MAXIMIZED PRODUCTION PIPELINE ENGINE"

on:
  push:
    branches: [ "main", "master", "dev" ] # Expanded branch scope triggers guards early
  pull_request:
    branches: [ "main", "master", "dev" ]
  schedule:
    - cron: "0 0 * * 1" # Automated baseline scans every Monday at midnight

permissions:
  contents: write
  security-events: write
  actions: read
  pages: write
  id-token: write

concurrency:
  # Smart grouping cancels older running builds if you push new code rapidly
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================================
  # JOB 1: CODE INTEGRITY, SECURITY SCRIPTING, & UNIT TESTING
  # ====================================================================
  validate-and-scan:
    name: "🛡️ INTEGRITY MATRIX AUDIT"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - name: "📥 Checkout Codebase (Full局 History)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history ensures TruffleHog checks old commits for leak paths

      - name: "🟢 Setup Node.js Runtime (LTS Engine)"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "📦 Install Deterministic Project Dependencies"
        run: npm ci --legacy-peer-deps

      - name: "🎨 Audit Code Style Layout (Prettier)"
        run: npm run format:check --if-present

      - name: "🔍 Execute Structural Code Linter (ESLint)"
        run: npm run lint --if-present

      - name: "📡 TRUFFLEHOG LEAK SCAN"
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name || github.head_ref }}
          extra_args: --results=verified,unknown

      # 🟢 HIGH-PERFORMANCE SECURITY TWEAK: Audits production packages only, ignoring noisy devDependencies
      - name: "📦 DEPENDENCY COMPOSITION ANALYSIS (SCA)"
        run: npm audit --only=prod --audit-level=high || true

      - name: "🧪 RUN AUTOMATED PORTFOLIO UNIT TESTS"
        run: npm run test
        env:
          CI: true

      - name: "🚀 INITIALIZE CODEQL CORE SAST ENGINE"
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: "💻 EXECUTE STATIC APPLICATION SECURITY DEEP SCANS"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # ====================================================================
  # JOB 2: AUTOMATED OPTIMIZED PRODUCTION DEPLOYMENT
  # ====================================================================
  build-and-deploy:
    name: "⚡ COMPILE & PUBLISH TO GITHUB PAGES"
    needs: validate-and-scan # 🛡️ Safe Gatekeeper: Will ONLY deploy if all testing and security steps pass!
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js Environment (V8 Core)"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: "⚡ Cache Vite Build Intermediates"
        uses: actions/cache@v4
        with:
          path: .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-

      - name: "📦 Install Clean Project Dependencies"
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: "🏗️ Execute Optimization Build"
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: npm run build

      - name: "⚙️ Setup GitHub Pages Deployment Context"
        uses: actions/configure-pages@v5

      - name: "📤 Upload Optimized Production Artifacts"
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: "🚀 Deploy to GitHub Pages Live Link"
        id: deployment
        uses: actions/deploy-pages@v4

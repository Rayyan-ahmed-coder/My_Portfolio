name: "🛡️ HARDENED PRODUCTION SECURITY PIPELINE"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * 1" # Runs automatically every Monday at midnight

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  code-quality-and-formatting:
    name: "✨ PRISTINE STYLE AUDIT"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Codebase"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "📦 Install Project Dependencies"
        run: npm ci --legacy-peer-deps


      - name: "🎨 Verify Code Formatting (Prettier)"
        run: npm run format:check

  secret-ingestion-audit:
    name: "📡 TRUFFLEHOG CRYPTO SCAN"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Codebase (Full History)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🎯 Scan for Leaked Private Keys & Cloud Tokens"
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  software-composition-analysis:
    name: "📦 DEPENDENCY COMPOSITION (SCA)"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Codebase"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "🛡️ Audit Production Dependency Tree"
        run: npm audit --audit-level=high

  static-application-security-testing:
    name: "💻 CODEQL ENGINE (SAST)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - name: "📥 Checkout Codebase"
        uses: actions/checkout@v4

      - name: "🚀 Initialize CodeQL Core Analysis Engine"
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: "⚡ Run Deep Static Code Optimization Rules"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
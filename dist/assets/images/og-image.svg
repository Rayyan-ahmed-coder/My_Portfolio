<svg xmlns="http://w3.org" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient matching #1d3557 theme -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1c2e" />
      <stop offset="100%" stop-color="#1d3557" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e63946" stroke-width="1" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- AMBIENT GLOWS (Theme Accent #e63946) -->
  <circle cx="1100" cy="100" r="250" fill="#e63946" fill-opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="550" r="300" fill="#457b9d" fill-opacity="0.1" filter="url(#glow)" />

  <!-- ABSTRACT GEOMETRIC WIREFRAME (UI/UX Engineering Visual Anchor) -->
  <g transform="translate(750, 140)" stroke="#457b9d" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <polygon points="150,0 300,100 300,280 150,380 0,280 0,100" stroke="#e63946" stroke-width="2" stroke-opacity="0.7"/>
    <polygon points="150,40 260,120 260,260 150,330 40,260 40,120" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="0" y1="100" x2="300" y2="280" />
    <line x1="300" y1="100" x2="0" y2="280" />
    <!-- Floating Tech Nodes -->
    <circle cx="150" cy="0" r="5" fill="#e63946" />
    <circle cx="300" cy="100" r="4" fill="#457b9d" />
    <circle cx="300" cy="280" r="4" fill="#457b9d" />
    <circle cx="150" cy="380" r="5" fill="#e63946" />
    <circle cx="0" cy="280" r="4" fill="#457b9d" />
    <circle cx="0" cy="100" r="4" fill="#457b9d" />
  </g>

  <!-- BRANDING / TYPOGRAPHY (Inter-styled structural paths) -->
  <!-- Decorative Dev Bracket Accent -->
  <path d="M 80,160 L 50,160 L 50,470 L 80,470" fill="none" stroke="#e63946" stroke-width="4" stroke-opacity="0.8" />
  
  <g font-family="'Inter', system-ui, -apple-system, sans-serif">
    <!-- Main Name -->
    <text x="90" y="240" font-size="64" font-weight="800" fill="#f1faee" letter-spacing="-1">
      Rayyan Khan
    </text>
    
    <!-- Title / Subheading -->
    <text x="90" y="300" font-size="28" font-weight="600" fill="#e63946" letter-spacing="4" text-transform="uppercase">
      Senior Frontend Developer
    </text>

    <!-- Core Tech Stack Badges / Indicators -->
    <text x="90" y="360" font-size="20" font-weight="400" fill="#a8dadc" opacity="0.8">
      Building blazing-fast, scalable &amp; highly interactive web experiences.
    </text>

    <!-- Visual Code Status Pill -->
    <g transform="translate(90, 410)">
      <rect width="140" height="36" rx="18" fill="#e63946" fill-opacity="0.15" stroke="#e63946" stroke-width="1.5"/>
      <circle cx="24" cy="18" r="5" fill="#e63946" />
      <text x="42" y="24" font-size="14" font-weight="700" fill="#f1faee" letter-spacing="1" text-transform="uppercase">
        React • TS
      </text>
    </g>

    <g transform="translate(245, 410)">
      <rect width="155" height="36" rx="18" fill="#457b9d" fill-opacity="0.15" stroke="#457b9d" stroke-width="1.5"/>
      <circle cx="24" cy="18" r="5" fill="#457b9d" />
      <text x="42" y="24" font-size="14" font-weight="700" fill="#f1faee" letter-spacing="1" text-transform="uppercase">
        Lightweight
      </text>
    </g>

    <!-- Portfolio URL Anchor -->
    <text x="90" y="520" font-size="16" font-weight="500" fill="#a8dadc" opacity="0.5" letter-spacing="1">
      rayyan-ahmed-coder.github.io/My_Portfolio_2v/
    </text>
  </g>
</svg>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Interrupted | Rayyan Khan Portfolio</title>
    <style>
        :root {
            --bg-color: #1d3557;
            --accent-color: #e63946;
            --text-color: #f1faee;
            --card-bg: #457b9d;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .offline-container {
            padding: 2rem;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 1rem;
        }

        .status-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: rgba(241, 250, 238, 0.85);
            margin: 0 0 1.5rem 0;
        }

        .retry-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        }

        .retry-btn:hover {
            background-color: #c92a36;
            transform: translateY(-1px);
        }

        .retry-btn:active {
            transform: translateY(1px);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="offline-container">
        <div class="status-icon">📡</div>
        <h1>Workspace Offline</h1>
        <p>Your connection was interrupted. Don't worry—Rayyan's core portfolio shell is cached and fully operational offline.</p>
        <button class="retry-btn" onclick="window.location.reload()">Recheck Connection</button>
    </div>
</body>
</html>

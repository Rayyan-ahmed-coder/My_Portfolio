    <!-- Content Security Policy: Patched script-src for dynamic minifier blobs -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'; 
        script-src 'self' 'unsafe-inline' 'unsafe-eval'; 
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
        font-src 'self' data: https: https://fonts.gstatic.com; 
        img-src 'self' data: blob: https://*.unsplash.com https://*.github.io https://*.githubusercontent.com;

    ">
    
    <title>Rayyan Khan — Frontend Developer | React, TypeScript &amp; Web Experiences</title>
    <meta name="description" content="Explore Rayyan Khan's frontend projects, built with React, TypeScript, JavaScript and responsive web technologies.">
    <meta name="keywords" content="Rayyan Khan, Frontend Developer, Portfolio, React, TypeScript, JavaScript, HTML5, CSS3, Responsive Design, Web Development">

    <!-- THEME & BROWSER INTEGRATION -->
    <meta name="theme-color" content="#ef476f" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07080f" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    
    <script>
        (function() {
            const key = '__portfolio_theme__';
            try {
                const saved = localStorage.getItem(key);
                const theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- CORE PRODUCTION ASSET TARGETS -->
    <link rel="stylesheet" href="./src/css/style.css" fetchpriority="high">
    <script type="module" src="./src/main.tsx" defer></script>

    <!-- FAVICONS & PWA MANIFEST ROUTING -->

    <!-- THEME & BROWSER INTEGRATION -->
    <meta name="theme-color" content="#e63946" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1d3557" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <script>
        (function() {
            const key = '__portfolio_theme__';
            try {
                const saved = localStorage.getItem(key);
                const theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

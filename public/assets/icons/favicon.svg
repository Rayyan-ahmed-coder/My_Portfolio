<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Rich Electric Cyan to Deep Azure Main Gradient -->
    <linearGradient id="mainBody" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Secondary Dimensional Gradient for the Sweeping Leg (Creates Overlap Depth) -->
    <linearGradient id="legRibbon" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#00b4f0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Top-Left Specular Rim Highlight -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#bae6fd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Clean Crisp Elevation Shadow -->
    <filter id="proShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#082f49" flood-opacity="0.32" />
    </filter>
  </defs>

  <g filter="url(#proShadow)">
    <!-- 1. Sweeping Dynamic Right Leg (Layered Underneath for Dimensional Overlap) -->
    <path fill="url(#legRibbon)" d="
      M 78 106
      H 112
      C 129 131, 146 154, 168 172
      C 150 175, 134 168, 118 151
      C 103 135, 91 119, 78 106
      Z
    " />

    <!-- 2. Main Architectural Stem & Bowl -->
    <path fill="url(#mainBody)" fill-rule="evenodd" d="
      M 28 18
      H 106
      C 145 18, 164 38, 164 68
      C 164 96, 145 114, 108 114
      H 66
      V 144
      L 36 174
      V 32
      L 28 23
      Z

      M 66 44
      V 88
      H 103
      C 122 88, 132 80, 132 66
      C 132 52, 122 44, 103 44
      Z
    " />

    <!-- 3. Precision Specular Rim Highlight (Gives Razor-Sharp Glass/Metal Polish) -->
    <path fill="none" stroke="url(#rimHighlight)" stroke-width="2" stroke-linejoin="round" d="
      M 30 20
      H 106
      C 143 20, 162 39, 162 68
      C 162 94, 144 112, 108 112
      H 64
      V 143
      L 38 169
      V 31
      Z
    " />
  </g>
</svg>